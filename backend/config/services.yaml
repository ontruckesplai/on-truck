# config/services.yaml
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # REGISTRA TODOS LOS CONTROLADORES
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # REGISTRA EL RESTO DE CLASES NORMALMENTE
    App\:
        resource: '../src/'
        exclude:
            - '../src/Controller/'
